[project]
name = "mistral-jupyter"
version = "0.1.0"
description = "Research playground for proof-of-concepts with Jupyter notebooks on the Mistral AI API"
requires-python = ">=3.12"
dependencies = [
    "jupyterlab>=4",
    "ipykernel>=6",
    "mistralai>=1",
    "python-dotenv>=1",
]

[dependency-groups]
dev = [
    "nbstripout>=0.9",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mistral_jupyter"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# notebook cells contain markdown prose; line length is a display concern there
"notebooks/*.ipynb" = ["E501"]
