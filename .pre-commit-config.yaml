# Hooks for this repo, run via `uvx pre-commit`.
# This is a standalone repo (formerly the mistral-jupyter/ subdirectory of a
# monorepo), so hooks apply to the whole tree — no `files:` prefix filter.
exclude: ^(uv\.lock|\.venv/|\.ruff_cache/)|(^|/)\.ipynb_checkpoints/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=512]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5 # keep in sync with the ruff version in uv.lock
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout # strip notebook outputs before they are committed

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks # block secrets (e.g. MISTRAL_API_KEY) from being committed
        args: [--config=.gitleaks.toml]
